<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="description" content="Scaleezy Logistics demo: compare your own courier accounts by PIN code, book, print labels and track every parcel.">
<title>Scaleezy Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&display=swap">
<style>
:root{
  --page:#EEF2EF;--surface:#FFFFFF;--sunk:#F4F7F5;--line:#D9E0DC;--line-strong:#B6C2BD;
  --ink:#14211E;--ink-2:#46564F;--ink-3:#5F6E69;
  --brand:#087C6E;--brand-ink:#FFFFFF;--brand-soft:#E0F1EC;--brand-strong:#06655A;
  --amber:#8F5400;--amber-soft:#FBEEDA;--red:#A93A32;--red-soft:#FBE7E4;--on-red:#FFFFFF;
  --blue:#2B5895;--blue-soft:#E3EBF7;--green:#1D6838;--green-soft:#DFF0E4;
  --r-sheet:18px;--r-card:12px;--r-ctl:10px;
  --font:"Anek Latin",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --page:#0E1513;--surface:#16201D;--sunk:#1B2623;--line:#29372F;--line-strong:#3E4F48;
  --ink:#E7EFEB;--ink-2:#B4C2BC;--ink-3:#93A29C;
  --brand:#3FB8A6;--brand-ink:#04211C;--brand-soft:#15352F;--brand-strong:#6BD0C0;
  --amber:#F0B45A;--amber-soft:#33260F;--red:#F08A80;--red-soft:#3A1C19;--on-red:#2A0D0A;
  --blue:#93B7EA;--blue-soft:#192740;--green:#83D39D;--green-soft:#15301F;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15;font-weight:650}
h1{font-size:28px;font-weight:700;font-stretch:86%;letter-spacing:-.005em}
h2{font-size:19px}
h3{font-size:16px}
h1:focus,h2:focus{outline:none}
p{margin:0}
a{color:var(--brand-strong)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:24px;height:24px;flex:none}
.lede{font-size:17px;color:var(--ink-2);max-width:60ch;margin:6px 0 22px}
.hint{font-size:14.5px;color:var(--ink-3)}
.fine{font-size:13.5px;color:var(--ink-3)}
.stack{display:grid;gap:14px}

/* shell */
.wordmark{display:inline-flex;align-items:baseline;gap:7px;font-weight:750;font-size:22px;font-stretch:84%;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.wordmark b{font-weight:750;color:var(--brand)}
.wordmark .wm-sub{font-weight:450;font-size:16px;font-stretch:100%;color:var(--ink-3)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--page);border-bottom:1px solid var(--line)}
.demo-pill{font-size:13px;font-weight:650;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:4px 10px}
main#view{display:block;padding:22px 16px calc(100px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;outline:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;min-height:58px;font-size:12.5px;font-weight:600;color:var(--ink-3);text-decoration:none}
.tab[aria-current=page]{color:var(--brand-strong)}
.count{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--surface);font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
.rail{display:none}
body.bare .topbar,body.bare .tabbar,body.bare .rail{display:none!important}
body.bare main#view{padding-bottom:48px}
@media (min-width:960px){
  .topbar,.tabbar{display:none}
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  body.bare .app{display:block}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .rail .wordmark{padding:0 10px 22px}
  .nav{position:relative;display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;color:var(--ink-2);font-weight:600;text-decoration:none}
  .nav:hover{background:var(--sunk)}
  .nav[aria-current=page]{background:var(--brand-soft);color:var(--brand-strong)}
  .nav .count{position:static;margin-left:auto}
  .rail-foot{margin-top:auto;padding:10px;font-size:13.5px;color:var(--ink-3)}
  .rail-foot strong{display:block;color:var(--ink-2);font-weight:600}
  main#view{padding:40px 44px 56px;max-width:820px;margin:0}
  main#view.wide{max-width:1260px}
  body.bare main#view{margin:0 auto}
  h1{font-size:34px}
}

/* controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font:inherit;font-size:15.5px;font-weight:600;line-height:1.2;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--brand-strong);padding-inline:10px}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.danger-quiet{color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:progress}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:14.5px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl)}
textarea{resize:vertical;min-height:84px}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ferr{font-size:14.5px;color:var(--red)}
.ferr[hidden]{display:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font-size:18px;font-weight:650}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:baseline;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip small{font-size:13.5px;font-weight:500;color:var(--ink-3)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.chip.warn[aria-pressed=false]{color:var(--amber);border-color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-ctl)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg-opt{position:relative;display:block;cursor:pointer}
.seg-opt input{position:absolute;inset:0;opacity:0;margin:0;min-height:0;cursor:pointer}
.seg-opt span{display:flex;align-items:center;justify-content:center;min-height:40px;padding:4px 8px;border-radius:8px;text-align:center;font-size:15px;font-weight:600;color:var(--ink-2)}
.seg-opt input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,30,.14),0 0 0 1px var(--line)}
.seg-opt input:focus-visible+span{outline:2px solid var(--brand);outline-offset:1px}
.seg.small{max-width:340px}

/* notes, pills, tags */
.note{padding:12px 14px;border-radius:var(--r-card);background:var(--sunk);color:var(--ink-2);font-size:15px}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.note.brand{background:var(--brand-soft);color:var(--brand-strong)}
.note.red{background:var(--red-soft);color:var(--red)}
.note a{color:inherit;font-weight:650}
.pill{display:inline-flex;align-items:center;flex:none;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:13.5px;font-weight:650;white-space:nowrap;border:1px solid var(--line)}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.pill.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.muted{color:var(--ink-3)}
.tag{display:inline-flex;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:13px;font-weight:650;border:1px solid var(--line)}
.tag.good{background:var(--green-soft);color:var(--green);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}

/* ship: the route block */
.ship-form{display:grid;gap:26px}
.route{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet)}
.leg{padding:16px 18px 18px;min-width:0}
.leg-to{border-top:2px dashed var(--line-strong)}
.leg-label{display:block;font-size:14.5px;font-weight:600;color:var(--ink-3)}
.pin{display:block;width:100%;max-width:7.4ch;margin:2px 0 6px;padding:0 0 2px;font-family:var(--font);font-size:46px;font-weight:650;font-stretch:78%;letter-spacing:.07em;line-height:1.08;color:var(--ink);background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;min-height:0}
.pin-input{border-bottom-color:var(--line-strong)}
.pin-input::placeholder{color:var(--line-strong);letter-spacing:.07em}
.pin-input:focus{border-bottom-color:var(--brand);outline:none}
.pin-input:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.pin-input[aria-invalid=true]{border-bottom-color:var(--red);box-shadow:none}
.leg-meta{font-size:14.5px;color:var(--ink-2);min-height:22px}
.leg-meta.bad{color:var(--red)}
.leg-sub{font-size:14.5px;color:var(--ink-3)}
.leg-select{margin-top:8px;min-height:40px;padding:6px 10px;font-size:15px;max-width:280px}
@media (min-width:640px){
  .route{grid-template-columns:1fr 1fr}
  .leg-to{border-top:0;border-left:2px dashed var(--line-strong)}
}
.dims{display:grid;grid-template-columns:minmax(96px,1fr) minmax(0,2fr);gap:12px;margin-top:14px}
.lbh{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px}
.lbh input{text-align:center;padding-inline:4px}
.lbh span{color:var(--ink-3)}
.group-foot{margin-top:10px}

/* results */
.results{margin-top:30px;display:grid;gap:14px}
.results h2{font-size:22px;font-stretch:90%}
.stale{margin-top:22px}
.quotes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.quote{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 16px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);cursor:pointer}
.quote:hover{border-color:var(--line-strong)}
.quote[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.q-main{display:grid;gap:1px;min-width:0}
.q-name{font-size:17.5px;font-weight:650}
.q-svc{font-weight:450;color:var(--ink-2)}
.q-acct{font-size:14px;color:var(--ink-3)}
.q-price{font-size:24px;font-weight:700;font-stretch:84%;line-height:1.1;text-align:right}
.q-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:4px;font-size:14.5px;color:var(--ink-2)}
.unavail summary{display:flex;align-items:center;min-height:44px;font-weight:600;color:var(--ink-2);cursor:pointer}
.unavail ul{list-style:none;margin:0 0 4px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.unavail li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:15px}
.unavail li+li{border-top:1px solid var(--line)}
.unavail li span:last-child{text-align:right}
.book{margin-top:22px;display:grid;gap:14px}
.book-sum strong{font-size:17px}

/* lists */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.list-tools{display:grid;gap:12px;margin:14px 0 12px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.strip .btn{min-height:38px;padding:6px 12px}
.rows,.acc-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.rows li+li,.acc-list li+li{border-top:1px solid var(--line)}
.row{display:grid;gap:3px;padding:14px 16px;color:inherit;text-decoration:none}
.row:hover{background:var(--sunk)}
.row.active{background:var(--brand-soft)}
.row-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-name{font-size:16.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:14.5px;color:var(--ink-2)}
.row-when{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}
.empty{padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-card)}
.empty p{color:var(--ink-2);max-width:40ch}
.split{display:grid;gap:28px}
@media (min-width:1180px){.split{grid-template-columns:minmax(360px,420px) minmax(0,1fr);align-items:start}}

/* detail */
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin:-8px 0 6px -8px;padding:6px 8px;color:var(--brand-strong);font-weight:600;text-decoration:none}
.back .ic{width:20px;height:20px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.d-head .hint{margin-top:4px}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.d-sec{margin-top:30px}
.d-sec>h2{margin-bottom:12px}
.eta{margin-bottom:14px;font-size:16.5px}
.panel{display:grid;gap:12px;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--sunk)}
.panel.warn{background:var(--red-soft);border-color:transparent}
.ndr{display:grid;gap:12px;margin-bottom:16px;border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.ndr h2{color:var(--amber)}
.d-note{margin-bottom:16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;gap:1px;padding:0 0 18px 28px}
.tl li::before{content:"";position:absolute;left:7px;top:10px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl li.now::after{background:var(--brand);border-color:var(--brand)}
.tl li.seller::after{border-style:dashed;border-color:var(--amber)}
.tl-status{font-weight:650}
.tl-when,.tl-raw{font-size:14px;color:var(--ink-3)}
.tl-note{font-size:14.5px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:minmax(104px,auto) minmax(0,1fr);gap:9px 18px;margin:0}
.facts dt{font-size:14.5px;color:var(--ink-3)}
.facts dd{margin:0;font-size:15.5px;overflow-wrap:anywhere}
.demo{padding:16px;border:1px dashed var(--line-strong);border-radius:var(--r-card)}
.demo h2{font-size:17px;margin-bottom:6px}
.demo .d-actions{margin-top:12px}
.demo .hint+.hint{margin-top:8px}

/* booking moment: label feeds out of the printer */
.booked{display:grid;gap:14px;margin-bottom:24px}
.booked-msg{font-size:16.5px}
.printer{max-width:412px}
.printer-mouth{height:12px;border-radius:10px 10px 3px 3px;background:var(--ink)}
.printer-clip{overflow:hidden;padding:0 12px 10px}
.printer .label{animation:feed 1.15s cubic-bezier(.22,.8,.24,1) both;box-shadow:0 10px 22px -14px rgba(0,0,0,.5)}
@keyframes feed{from{transform:translateY(-101%)}to{transform:none}}

/* the label itself is always black on white, like thermal stock */
.label{display:flex;flex-direction:column;width:100%;max-width:388px;background:#fff;color:#000;border:2px solid #000;border-radius:2px;font-family:var(--font);font-size:12.5px;line-height:1.32;font-variant-numeric:tabular-nums}
.lb-row{padding:8px 10px;border-bottom:2px solid #000}
.lb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lb-courier{font-size:21px;font-weight:800;font-stretch:80%;line-height:1}
.lb-small{font-size:11.5px;margin-top:2px}
.lb-pay{text-align:right;font-size:11.5px;padding:3px 7px;border:2px solid #000}
.lb-pay strong{display:block;font-size:15px;font-weight:800;line-height:1.15}
.lb-pay.cod{background:#000;color:#fff}
.lb-code{text-align:center}
.lb-bars{display:block;width:100%;height:58px;fill:#000}
.lb-awb{margin-top:4px;font-size:15px;font-weight:700;letter-spacing:.07em}
.lb-k{font-size:11px;font-weight:700}
.lb-name{font-size:16px;font-weight:800}
.lb-pin{margin-top:4px;font-size:32px;font-weight:800;font-stretch:76%;letter-spacing:.06em;line-height:1}
.lb-from{font-size:11.5px}
.lb-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px}
.lb-void{padding:6px 10px;font-size:11px;font-weight:700;text-align:center}

/* couriers + settings */
.acc{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px}
.acc-name{font-size:17px;font-weight:650}
.acc-ok{margin-top:4px;font-size:14.5px;color:var(--green)}
.sub{margin:30px 0 10px}
.settings{display:grid;gap:16px}
.pickups{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pickups li{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-card)}
.pickups .d-actions{margin-top:6px}
.pk-top{display:flex;align-items:center;gap:8px;font-weight:650}
.who{display:grid;gap:16px}
.who ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.who li+li{margin-top:4px}
@media (min-width:640px){.who{grid-template-columns:1fr 1fr}}

/* setup + public tracking */
.setup,.track{max-width:560px;margin:0 auto;display:grid;gap:18px}
.setup>.wordmark,.track>.wordmark{margin-bottom:6px}
.setup-title{font-size:38px;font-stretch:80%;line-height:1.04}
.setup h3{margin-top:6px;font-size:17px}
.track-from{color:var(--ink-2)}
.track-status{font-size:40px;font-stretch:78%;line-height:1.02}
.track-eta{font-size:17px}
.track h2{margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:15px;font-weight:600;opacity:0;transform:translate(-50%,6px);pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){#toast{bottom:28px}}
body.bare #toast{bottom:28px}
#printArea{display:none}

@media (prefers-reduced-motion:reduce){
  .printer .label{animation:none}
  #toast{transition:none}
}
@media print{
  @page{size:4in 6in;margin:0}
  html,body{background:#fff}
  .app,#toast{display:none!important}
  #printArea{display:block}

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const KEY = 'scaleezy-logistics-demo-v2';
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtKg = n => (Number.isInteger(n) ? n : +n.toFixed(2)) + ' kg';
const fmtDay = d => new Date(d).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
const fmtTime = d => new Date(d).toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'});
const sameDate = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function fmtWhen(d){
  const now = Date.now();
  const label = sameDate(d, now) ? 'Today' : sameDate(d, now - DAY) ? 'Yesterday' : sameDate(d, now + DAY) ? 'Tomorrow' : fmtDay(d);
  return label + ', ' + fmtTime(d);
}
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const isWide = () => matchMedia('(min-width: 1180px)').matches;
const first = name => String(name).trim().split(/\s+/)[0];
const uid = () => Math.random().toString(36).slice(2, 9);
function hash(str){ let x = 2166136261; for (let i = 0; i < str.length; i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0) % 100; }
function vals(form){ const o = {}; new FormData(form).forEach((v, k) => { o[k] = String(v); }); return o; }

/* ---------- storage: this browser only ---------- */
let memory = null;
const blank = () => ({v:2, business:null, pickups:[], accounts:{}, shipments:[], seq:0});
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (d && d.v === 2) return d; } } catch (e) {}
  return memory || blank();
}
let S = load();
function save(){ memory = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- PIN knowledge (approximate, for display and mock pricing) ---------- */
const REGIONS = [[11,11,'Delhi'],[12,13,'Haryana'],[14,16,'Punjab and Chandigarh'],[17,17,'Himachal Pradesh'],[18,19,'Jammu, Kashmir and Ladakh'],[20,28,'Uttar Pradesh and Uttarakhand'],[30,34,'Rajasthan'],[36,39,'Gujarat'],[40,44,'Maharashtra'],[45,48,'Madhya Pradesh'],[49,49,'Chhattisgarh'],[50,50,'Telangana'],[51,53,'Andhra Pradesh'],[56,59,'Karnataka'],[60,64,'Tamil Nadu'],[67,69,'Kerala'],[70,74,'West Bengal'],[75,77,'Odisha'],[78,78,'Assam'],[79,79,'North East'],[80,85,'Bihar and Jharkhand']];
const CITIES = {'110':'Delhi','400':'Mumbai','560':'Bengaluru','600':'Chennai','700':'Kolkata','500':'Hyderabad','411':'Pune','380':'Ahmedabad','302':'Jaipur','226':'Lucknow','452':'Indore','641':'Coimbatore','682':'Kochi','695':'Thiruvananthapuram','530':'Visakhapatnam','520':'Vijayawada','160':'Chandigarh','751':'Bhubaneswar','781':'Guwahati','800':'Patna','834':'Ranchi','395':'Surat','440':'Nagpur','462':'Bhopal','248':'Dehradun','122':'Gurugram','201':'Noida and Ghaziabad','403':'Goa'};
const METROS = ['110','400','560','600','700','500','411','380'];
function regionOf(pin){
  if (!/^\d{6}$/.test(pin)) return null;
  const p3 = pin.slice(0,3);
  if (p3 === '403') return 'Goa';
  if (p3 === '737') return 'Sikkim';
  if (p3 === '744') return 'Andaman and Nicobar';
  const p2 = +pin.slice(0,2);
  const r = REGIONS.find(([a, b]) => p2 >= a && p2 <= b);
  return r ? r[2] : null;
}
const placeOf = pin => CITIES[pin.slice(0,3)] || regionOf(pin) || 'India';
function areaOf(pin){ const c = CITIES[pin.slice(0,3)], r = regionOf(pin); return c && c !== r ? c + ' area, ' + r : (r || 'India'); }
const isRemote = pin => ['18','19','78','79'].includes(pin.slice(0,2)) || ['737','744'].includes(pin.slice(0,3));
function zone(a, b){
  if (isRemote(a) || isRemote(b)) return 'remote';
  if (a.slice(0,3) === b.slice(0,3)) return 'local';
  if (regionOf(a) === regionOf(b)) return 'state';
  if (METROS.includes(a.slice(0,3)) && METROS.includes(b.slice(0,3))) return 'metro';
  return 'national';
}
const ZONES = {
  local:{label:'Same city', d:[1,2], first:30, add:24},
  state:{label:'Within the state', d:[2,3], first:36, add:30},
  metro:{label:'Metro to metro', d:[2,4], first:44, add:36},
  national:{label:'Rest of India', d:[4,6], first:50, add:42},
  remote:{label:'Remote area', d:[6,9], first:66, add:56}
};

/* ---------- couriers (simulated) ---------- */
const ACCOUNTS = {
  delhivery:{name:'Delhivery', kind:'Direct courier account', bills:'Delhivery bills you directly.', help:'In Delhivery One, open the developer portal and copy your API token.', fields:[{k:'token', label:'API token', type:'password', err:'Paste your API token.'}]},
  shiprocket:{name:'Shiprocket', kind:'Your aggregator account', bills:'Shipping is charged to your Shiprocket wallet. Gives you Ekart and Shadowfax through one account.', help:'In Shiprocket, open Settings, then API, and create an API user. It needs an email that is different from your Shiprocket login.', fields:[{k:'email', label:'API user email', type:'email', err:'Enter the API user email.'},{k:'password', label:'API user password', type:'password', err:'Enter the API user password.'}]},
  xpressbees:{name:'Xpressbees', kind:'Direct courier account', bills:'Xpressbees bills you directly.', help:'Ask your Xpressbees account manager for API credentials for your business account.', fields:[{k:'key', label:'Auth key', type:'password', err:'Paste your auth key.'},{k:'account', label:'Business account name', type:'text', err:'Enter your business account name.'}]}
};
const COMING = [
  {name:'Blue Dart', line:'Direct account. Blue Dart approves each business before it goes live.'},
  {name:'Ekart', line:'Direct account. Ekart is already available through Shiprocket.'},
  {name:'Shadowfax', line:'Direct account. Shadowfax is already available through Shiprocket.'},
  {name:'ONDC network', line:'Ship without a courier account of your own, paid per booking.'}
];
const SERVICES = [
  {id:'dl-surface', acct:'delhivery', courier:'Delhivery', svc:'Surface', f:1.0, shift:0, cover:96, cod:94, maxKg:50, prefix:'DL'},
  {id:'dl-express', acct:'delhivery', courier:'Delhivery', svc:'Express', f:1.6, shift:-2, cover:90, cod:90, maxKg:20, prefix:'DL', express:true},
  {id:'xb-surface', acct:'xpressbees', courier:'Xpressbees', svc:'Surface', f:0.93, shift:0, cover:88, cod:86, maxKg:30, prefix:'XB'},
  {id:'sr-ekart', acct:'shiprocket', courier:'Ekart', svc:'Surface', f:0.96, shift:1, cover:91, cod:90, maxKg:25, prefix:'EK'},
  {id:'sr-shadowfax', acct:'shiprocket', courier:'Shadowfax', svc:'Standard', f:1.04, shift:-1, cover:74, cod:80, maxKg:10, prefix:'SF', noRemote:true}
];
const svcById = id => SERVICES.find(s => s.id === id);
const serves = (s, pin) => hash(s.courier + ':' + pin) < s.cover;
const codOk = (s, pin) => hash('cod:' + s.id + ':' + pin) < s.cod;
const viaLine = s => s.acct === 'shiprocket' ? 'Through your Shiprocket account' : 'Your ' + ACCOUNTS[s.acct].name + ' account';
const svcLabel = sh => sh.courier + ' ' + sh.service + (sh.acct === 'shiprocket' ? ' through Shiprocket' : '');

function billed(kg, l, b, h){
  const vol = (l && b && h) ? (l * b * h) / 5000 : 0;
  const raw = Math.max(kg, vol);
  return {kg: Math.max(0.5, Math.ceil(raw * 2 - 1e-9) / 2), bySize: vol > kg};
}
function priceFor(s, z, bkg, pay, value){
  const zt = ZONES[z];
  const slabs = Math.round(bkg / 0.5);
  const freight = Math.round((zt.first + (slabs - 1) * zt.add) * s.f);
  const codFee = pay === 'cod' ? Math.round(Math.max(30, value * 0.018)) : 0;
  const gst = Math.round((freight + codFee) * 0.18);
  return {freight, codFee, gst, total: freight + codFee + gst};
}
function daysFor(s, z){ const [a, b] = ZONES[z].d; return [Math.max(1, a + s.shift), Math.max(1, b + s.shift)]; }
function addDays(from, n){
  const d = new Date(from); d.setHours(12, 0, 0, 0);
  let left = n;
  while (left > 0){ d.setTime(d.getTime() + DAY); if (d.getDay() !== 0) left--; }
  return d;
}
function pickupDays(){
  const now = new Date(); let d = new Date(now); d.setHours(12, 0, 0, 0);
  if (now.getHours() >= 16) d = new Date(d.getTime() + DAY);
  const out = [];
  while (out.length < 3){ if (d.getDay() !== 0) out.push(new Date(d)); d = new Date(d.getTime() + DAY); }
  return out;
}

/* ---------- shipment statuses ---------- */
const ST = {
  booked:{label:'Booked', tone:'', cust:'Packed and waiting for the courier'},
  pickup_scheduled:{label:'Pickup scheduled', tone:'', cust:'Courier pickup is scheduled'},
  picked_up:{label:'Picked up', tone:'blue', cust:'Picked up by the courier'},
  in_transit:{label:'In transit', tone:'blue', cust:'On the way'},
  out_for_delivery:{label:'Out for delivery', tone:'blue', cust:'Out for delivery'},
  delivered:{label:'Delivered', tone:'green', cust:'Delivered'},
  delivery_failed:{label:'Delivery failed', tone:'amber', cust:'Delivery attempt missed'},
  return_in_transit:{label:'Return in transit', tone:'red', cust:'Being returned to the seller'},
  returned_to_origin:{label:'Returned to origin', tone:'red', cust:'Returned to the seller'},
  cancelled:{label:'Cancelled', tone:'muted', cust:'Cancelled by the seller'},
  lost:{label:'Lost or damaged', tone:'red', cust:'Delayed. The seller will contact you.'}
};
const RAW = {
  delhivery:{booked:'Manifested', pickup_scheduled:'Pickup scheduled', picked_up:'Picked up', in_transit:'In transit', out_for_delivery:'Dispatched', delivered:'Delivered', delivery_failed:'Pending, consignee unavailable', return_in_transit:'RTO in transit', returned_to_origin:'RTO delivered', cancelled:'Cancelled', lost:'Lost'},
  xpressbees:{booked:'Data received', pickup_scheduled:'Pickup assigned', picked_up:'Shipment picked', in_transit:'In transit', out_for_delivery:'Out for delivery', delivered:'Delivered', delivery_failed:'Undelivered', return_in_transit:'RTO in transit', returned_to_origin:'RTO delivered', cancelled:'Cancelled', lost:'Shipment lost'},
  shiprocket:{booked:'AWB assigned', pickup_scheduled:'Pickup scheduled', picked_up:'Picked up', in_transit:'In transit', out_for_delivery:'Out for delivery', delivered:'Delivered', delivery_failed:'Undelivered', return_in_transit:'RTO initiated', returned_to_origin:'RTO delivered', cancelled:'Canceled', lost:'Lost'}
};
const NEXT = {booked:'pickup_scheduled', pickup_scheduled:'picked_up', picked_up:'in_transit', in_transit:'out_for_delivery', out_for_delivery:'delivered', return_in_transit:'returned_to_origin'};
const TERMINAL = ['delivered','returned_to_origin','cancelled','lost'];
const FAIL_REASONS = ['Customer not reachable on phone','Address incomplete','Customer asked for delivery later','Customer refused the parcel'];
const PRESETS = [
  {id:'pouch', name:'Pouch', kg:0.3, l:30, b:25, h:2},
  {id:'small', name:'Small box', kg:0.8, l:22, b:16, h:8},
  {id:'medium', name:'Medium box', kg:1.5, l:30, b:24, h:12},
  {id:'large', name:'Large box', kg:3, l:40, b:30, h:20}
];
const FILTERS = [['all','All'],['action','Needs action'],['pickup','To pick up'],['transit','On the way'],['delivered','Delivered'],['returns','Returns'],['closed','Closed']];
function groupOf(sh){
  const s = sh.status;
  if (s === 'delivery_failed' && sh.awaiting) return 'action';
  if (s === 'booked' || s === 'pickup_scheduled') return 'pickup';
  if (['picked_up','in_transit','out_for_delivery','delivery_failed'].includes(s)) return 'transit';
  if (s === 'delivered') return 'delivered';
  if (s === 'return_in_transit' || s === 'returned_to_origin') return 'returns';
  return 'closed';
}

/* ---------- shipment model ---------- */
const byId = id => S.shipments.find(x => x.id === id);
const defaultPickup = () => S.pickups.find(p => p.isDefault) || S.pickups[0] || null;
const lastAt = sh => Math.max(...sh.events.map(e => e.at));
const nextRef = () => 'SZ-' + (1001 + S.seq);
function placeFor(sh, status){
  const from = placeOf(sh.fromPin), to = placeOf(sh.toPin);
  if (['booked','pickup_scheduled','picked_up','returned_to_origin','cancelled'].includes(status)) return from;
  if (status === 'in_transit') return 'Sorting hub, ' + to;
  return to;
}
function addEvent(sh, status, at, note){
  sh.status = status;
  sh.events.push({status, at: at || Date.now(), place: placeFor(sh, status), raw: RAW[sh.acct][status], note: note || ''});
}
function addSellerNote(sh, text){ sh.events.push({kind:'seller', text, at: Math.max(Date.now(), lastAt(sh) + 1000)}); }
function makeShipment(o){
  const s = svcById(o.svcId), p = o.pickup, at = o.at || Date.now();
  const z = zone(p.pin, o.toPin);
  const bw = billed(o.kg, o.l, o.b, o.h);
  const price = priceFor(s, z, bw.kg, o.pay, o.value || 0);
  const [, maxD] = daysFor(s, z);
  S.seq++;
  const sh = {
    id: 's' + S.seq + uid(), ref: o.ref || ('SZ-' + (1000 + S.seq)),
    awb: 'DEMO-' + s.prefix + '-' + String(10000000 + Math.floor(Math.random() * 89999999)),
    svcId: s.id, acct: s.acct, courier: s.courier, service: s.svc,
    from: {name:p.name, contact:p.contact, phone:p.phone, address:p.address, pin:p.pin}, fromPin: p.pin, toPin: o.toPin,
    customer: o.customer, phone: o.phone, address: o.address, landmark: o.landmark || '',
    kg: o.kg, dims: (o.l && o.b && o.h) ? [o.l, o.b, o.h] : null, billedKg: bw.kg, bySize: bw.bySize,
    pay: o.pay, value: o.value || 0, price, zone: z, createdAt: at, edd: addDays(at, maxD).getTime(),
    pickupDate: null, events: [], awaiting: false, failure: null, decision: null, attempts: 0,
    remit: o.pay === 'cod' ? 'later' : 'na', remitAt: null, deliveredAt: null
  };
  addEvent(sh, 'booked', at);
  return sh;
}
function advance(sh){
  let next;
  if (sh.status === 'delivery_failed'){
    if (sh.awaiting) return 'Choose what the courier should do first.';
    next = sh.decision === 'rto' ? 'return_in_transit' : 'out_for_delivery';
  } else next = NEXT[sh.status];
  if (!next) return 'This shipment has no more updates.';
  const t = Math.max(Date.now(), lastAt(sh) + 1000);
  if (next === 'pickup_scheduled'){ sh.pickupDate = pickupDays()[0].getTime(); addEvent(sh, next, t, 'Pickup on ' + fmtDay(sh.pickupDate)); }
  else addEvent(sh, next, t);
  if (next === 'delivered'){ sh.deliveredAt = t; if (sh.pay === 'cod') sh.remit = 'pending'; }
  return null;
}
function failDelivery(sh){
  const t = Math.max(Date.now(), lastAt(sh) + 1000);
  const reason = FAIL_REASONS[hash(sh.id + sh.events.length) % FAIL_REASONS.length];
  addEvent(sh, 'delivery_failed', t, reason);
  sh.awaiting = true; sh.failure = {reason, at: t}; sh.attempts = (sh.attempts || 0) + 1; sh.decision = null;
}
function decide(sh, d){
  const A = ACCOUNTS[sh.acct].name;
  sh.awaiting = false; sh.decision = d;
  if (d === 'rto'){ addSellerNote(sh, 'You asked ' + A + ' to return the parcel to you'); if (sh.pay === 'cod') sh.remit = 'na'; }
  else {
    addSellerNote(sh, d === 'update' ? 'You updated the customer details and asked ' + A + ' to try again' : 'You asked ' + A + ' to try delivery again');
    sh.edd = addDays(Date.now(), 1).getTime();
  }
}

/* ---------- sample data ---------- */
function workTime(t, now, slot){
  const d = new Date(t), h = d.getHours();
  if (h < 9) d.setHours(9 + (slot % 3), (slot * 17) % 60, 0, 0);
  else if (h >= 20) d.setHours(18 + (slot % 2), (slot * 23) % 60, 0, 0);
  return Math.min(d.getTime(), now - (10 - slot) * 6e5);
}
function addSamples(){
  const p = defaultPickup(); if (!p) return;
  const H = 36e5, now = Date.now();
  const path = ['pickup_scheduled','picked_up','in_transit','out_for_delivery'];
  const defs = [
    {svcId:'dl-surface', toPin:'560038', customer:'Ananya Rao', phone:'9000000101', address:'12, 4th Cross, Indiranagar, Bengaluru', kg:0.8, l:22, b:16, h:8, pay:'prepaid', value:2199, ageH:96, steps:[...path,'delivered']},
    {svcId:'xb-surface', toPin:'400050', customer:'Farah Khan', phone:'9000000102', address:'Flat 3B, Sea View Apartments, Bandra West, Mumbai', kg:1.5, l:30, b:24, h:12, pay:'cod', value:1899, ageH:54, steps:path},
    {svcId:'sr-ekart', toPin:'600017', customer:'Lakshmi Priya', phone:'9000000103', address:'22, Usman Road, T. Nagar, Chennai', kg:0.3, l:30, b:25, h:2, pay:'cod', value:2450, ageH:76, steps:[...path,'FAIL']},
    {svcId:'dl-express', toPin:'700019', customer:'Meghna Das', phone:'9000000104', address:'8, Ballygunge Place, Kolkata', kg:0.8, l:22, b:16, h:8, pay:'cod', value:1299, ageH:130, steps:[...path,'delivered']},
    {svcId:'dl-surface', toPin:'500081', customer:'Riya Sharma', phone:'9000000105', address:'Flat 502, Cyber Towers Road, Madhapur, Hyderabad', kg:0.8, l:22, b:16, h:8, pay:'prepaid', value:1650, ageH:2, steps:[]}
  ];
  for (const d of defs){
    const at = workTime(now - d.ageH * H, now, 0);
    const sh = makeShipment({...d, pickup:p, at});
    const span = (now - at) * 0.85;
    let prev = at;
    d.steps.forEach((step, i) => {
      const t = prev = Math.max(prev + 6e5, workTime(at + span * (i + 1) / d.steps.length, now, i + 1));
      if (step === 'FAIL'){
        const reason = FAIL_REASONS[0];
        addEvent(sh, 'delivery_failed', t, reason);
        sh.awaiting = true; sh.failure = {reason, at:t}; sh.attempts = 1;
      } else {
        addEvent(sh, step, t, step === 'pickup_scheduled' ? 'Pickup on ' + fmtDay(t) : '');
        if (step === 'pickup_scheduled') sh.pickupDate = t;
        if (step === 'delivered'){ sh.deliveredAt = t; if (sh.pay === 'cod') sh.remit = 'pending'; }
      }
    });
    S.shipments.push(sh);
  }
  S.shipments.sort((a, b) => b.createdAt - a.createdAt);
}
function loadSampleSetup(){
  S = blank();
  S.business = {name:'Indigo Thread Boutique', gstin:''};
  S.pickups = [{id:'p' + uid(), name:'Gachibowli store', contact:'Store manager', phone:'9000000100', address:'Shop 14, Gachibowli Main Road, Hyderabad', pin:'500032', isDefault:true}];
  for (const k of Object.keys(ACCOUNTS)) S.accounts[k] = {connected:true, at:Date.now()};
  addSamples();
  save();
}

/* ---------- UI state (not stored) ---------- */
const ui = {draft:null, quotes:null, sort:'cheap', pick:null, bookDraft:{}, filter:'all', q:'', justBooked:null, panel:null, panelFor:null, connect:{}, confirmDisc:null, confirmReset:false, editPickup:null};
function freshDraft(){ const p = defaultPickup(); return {pickupId: p ? p.id : null, toPin:'', preset:'small', kg:'0.8', l:'22', b:'16', h:'8', pay:'prepaid', value:''}; }

/* ---------- small renderers ---------- */
const ICONS = {
  ship:'<path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  couriers:'<path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="6" cy="18.2" r="1.7"/><circle cx="17" cy="18.2" r="1.7"/>',
  settings:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const icon = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
const NAV = [['ship','Ship','ship'],['shipments','Shipments','list'],['couriers','Couriers','couriers'],['settings','Settings','settings']];
function attrs(o){ return Object.entries(o || {}).map(([k, v]) => ' ' + k + '="' + esc(v) + '"').join(''); }
function field(name, label, type, value, at, hint){
  const id = 'f-' + name;
  const desc = (hint ? id + '-hint ' : '') + id + '-err';
  const ctl = type === 'textarea'
    ? '<textarea id="' + id + '" name="' + name + '" rows="3" aria-describedby="' + desc + '"' + attrs(at) + '>' + esc(value) + '</textarea>'
    : '<input id="' + id + '" name="' + name + '" type="' + (type || 'text') + '" value="' + esc(value) + '" aria-describedby="' + desc + '"' + attrs(at) + '>';
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' + ctl + (hint ? '<p class="hint" id="' + id + '-hint">' + esc(hint) + '</p>' : '') + '<p class="ferr" id="' + id + '-err" hidden></p></div>';
}
function radio(name, value, label, current){
  const id = 'r-' + name + '-' + value;
  return '<label class="seg-opt" for="' + id + '"><input type="radio" id="' + id + '" name="' + name + '" value="' + esc(value) + '"' + (String(current) === String(value) ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
}

function clearErrs(form){
  form.querySelectorAll('.ferr').forEach(e => { e.hidden = true; e.textContent = ''; });
  form.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
}
function showErrs(form, errs){
  let firstEl = null;
  for (const [name, msg] of Object.entries(errs)){
    const el = form.elements[name] || (name === 'dims' ? form.elements.l : null);
    const er = form.querySelector('#f-' + name + '-err');
    if (el && el.setAttribute) el.setAttribute('aria-invalid', 'true');
    if (er){ er.textContent = msg; er.hidden = false; }
    if (!firstEl && el && el.focus) firstEl = el;
  }
  if (firstEl) firstEl.focus();
  return Object.keys(errs).length === 0;
}

function computeQuotes(){
  const d = ui.draft, p = S.pickups.find(x => x.id === d.pickupId);
  const from = p.pin, to = d.toPin, z = zone(from, to);
  const bw = billed(+d.kg, +d.l || 0, +d.b || 0, +d.h || 0);
  const value = parseFloat(d.value) || 0;
  const ok = [], no = [], notConnected = [];
  for (const s of SERVICES){
    if (!(S.accounts[s.acct] && S.accounts[s.acct].connected)){ if (!notConnected.includes(s.acct)) notConnected.push(s.acct); continue; }
    if (s.express && z === 'local') continue;
    let why = null;
    if (!serves(s, from)) why = "Doesn't pick up from " + from;
    else if (!serves(s, to)) why = "Doesn't deliver to " + to;
    else if (s.noRemote && z === 'remote') why = "Doesn't serve remote areas";
    else if (bw.kg > s.maxKg) why = 'Takes parcels up to ' + s.maxKg + ' kg';
    else if (d.pay === 'cod' && !codOk(s, to)) why = 'No cash on delivery to ' + to;
    if (why){ no.push({s, why}); continue; }
    const [a, b] = daysFor(s, z);
    ok.push({s, pr: priceFor(s, z, bw.kg, d.pay, value), days:[a, b], edd: addDays(Date.now(), b).getTime()});
  }
  const minP = Math.min(...ok.map(q => q.pr.total)), minD = Math.min(...ok.map(q => q.days[1]));
  const dayVaries = new Set(ok.map(q => q.days[1])).size > 1;
  ok.forEach(q => { q.cheapest = ok.length > 1 && q.pr.total === minP; q.fastest = dayVaries && q.days[1] === minD; });
  return {from, to, z, bw, ok, no, notConnected, pay: d.pay, value, pickupId: p.id};
}
function resultsHtml(){

  const list = [...Q.ok].sort(sorter);
  const head = Q.ok.length ? Q.ok.length + (Q.ok.length === 1 ? ' option' : ' options') + ' to ' + Q.to
    : Q.notConnected.length === Object.keys(ACCOUNTS).length ? 'Connect a courier account to see prices' : 'None of your couriers can take this parcel';
  const rows = [
    ...Q.notConnected.map(k => ({name: ACCOUNTS[k].name + ' account', link: k})),
    ...Q.no.map(n => ({name: n.s.courier + ' ' + n.s.svc + (n.s.acct === 'shiprocket' ? ' through Shiprocket' : ''), why: n.why}))

    '<div class="stack" style="gap:6px"><h2 id="resHead" tabindex="-1">' + esc(head) + '</h2>' +

    (Q.ok.length > 1 ? '<div class="seg small" role="radiogroup" aria-label="Sort couriers">' + radio('sort', 'cheap', 'Cheapest first', ui.sort) + radio('sort', 'fast', 'Fastest first', ui.sort) + '</div>' : '') +
    (list.length ? '<ul class="quotes">' + list.map(quoteHtml).join('') + '</ul>' : '') +
    (rows.length ? '<details class="unavail"' + (Q.ok.length ? '' : ' open') + '><summary>' + rows.length + ' more not available on this route</summary><ul>' +
      rows.map(r => '<li><span>' + esc(r.name) + '</span><span class="hint">' + (r.link ? '<a href="#/couriers/' + r.link + '">Connect</a>' : esc(r.why)) + '</span></li>').join('') + '</ul></details>' : '') +

}

function barcode(str){
  const seq = [3, 1, 1, 1];
  for (const ch of str){ const c = ch.charCodeAt(0); for (let i = 0; i < 6; i++) seq.push(((c >> i) & 1) + 1); }
  seq.push(1, 1, 3);
  let x = 12, on = true, bars = '';
  for (const w of seq){ const ww = w * 1.5; if (on) bars += '<rect x="' + x.toFixed(1) + '" y="0" width="' + ww.toFixed(1) + '" height="60"/>'; x += ww; on = !on; }
  return '<svg class="lb-bars" viewBox="0 0 ' + (x + 12).toFixed(1) + ' 60" preserveAspectRatio="none" aria-hidden="true">' + bars + '</svg>';
}

/* ---------- router ---------- */
const view = $('#view');
let lastKey = null;
function parts(){ return (location.hash.replace(/^#\/?/, '') || 'ship').split('/').filter(Boolean).map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } }); }
function setNav(r){
  const action = S.shipments.filter(sh => groupOf(sh) === 'action').length;
  const item = ([k, label, ic]) => '<a class="CLS" href="#/' + k + '"' + (r === k ? ' aria-current="page"' : '') + '>' + icon(ic) + '<span>' + label + '</span>' + (k === 'shipments' && action ? '<span class="count" aria-label="' + action + ' need action">' + action + '</span>' : '') + '</a>';
  $('#tabNav').innerHTML = NAV.map(n => item(n).replace('CLS', 'tab')).join('');
  $('#railNav').innerHTML = NAV.map(n => item(n).replace('CLS', 'nav')).join('');
  $('#railFoot').innerHTML = S.business ? '<strong>' + esc(S.business.name) + '</strong>Demo: couriers are simulated and data stays in this browser.' : '';
}
function render(){
  const [r, a] = parts();
  const key = r + '/' + (a || '');
  const changed = key !== lastKey; lastKey = key;
  if (changed){ ui.panel = null; ui.panelFor = null; ui.confirmDisc = null; ui.confirmReset = false; if (!(r === 'shipments' && a === ui.justBooked)) ui.justBooked = null; }
  document.body.classList.toggle('bare', r === 'track' || r === 'setup');
  view.className = '';
  let html;
  if (r === 'track'){ html = trackView(a); }
  else if (!S.business && r !== 'setup'){ location.replace('#/setup'); return; }
  else if (S.business && r === 'setup'){ location.replace('#/ship'); return; }
  else {
    setNav(r);
    if (r === 'setup') html = setupView();
    else if (r === 'ship') html = shipView();
    else if (r === 'shipments') html = shipmentsView(a);
    else if (r === 'couriers') html = a ? connectView(a) : couriersView();
    else if (r === 'settings') html = settingsView();
    else { location.replace('#/ship'); return; }
  }
  view.innerHTML = html;
  document.title = r === 'track' ? 'Track your order' : 'Scaleezy Logistics';
  if (changed){
    window.scrollTo(0, 0);
    const h = view.querySelector('h1');
    if (h && lastKey !== null){ h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); }
  }
}
function rerender(focusSel){ render(); if (focusSel){ const el = $(focusSel); if (el) el.focus({preventScroll:true}); } }

    Object.assign(d, {preset:pr.id, kg:String(pr.kg), l:String(pr.l), b:String(pr.b), h:String(pr.h)});
    ['kg','l','b','h'].forEach(n => { f.elements[n].value = d[n]; f.elements[n].removeAttribute('aria-invalid'); });
    f.querySelectorAll('[data-act=preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === pr.id)));
    updateShipHints(); markStale();
  },
  pick(t){
    ui.pick = t.dataset.id;
    $('#results').querySelectorAll('.quote').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === ui.pick)));
    const area = $('#bookArea'); area.innerHTML = bookHtml();
    area.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'});
    const h = $('#bookHead'); if (h) h.focus({preventScroll:true});
  },
  filter(t){ ui.filter = t.dataset.f; rerender('[data-act=filter][data-f="' + ui.filter + '"]'); },
  clearFilter(){ ui.filter = 'all'; ui.q = ''; rerender('#shipSearch'); },
  panel(t){ const same = ui.panel === t.dataset.p && ui.panelFor === t.dataset.id; ui.panel = same ? null : t.dataset.p; ui.panelFor = t.dataset.id; rerender(same ? null : '.panel input, .panel button, #updForm input'); },
  closePanel(){ ui.panel = null; rerender(); },
  copy(){
    const inp = $('#trackLink'); if (!inp) return;
    const fallback = () => { inp.focus(); inp.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} toast(ok ? 'Tracking link copied' : 'Select the link and copy it'); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(inp.value).then(() => toast('Tracking link copied'), fallback);
    else fallback();
  },
  print(t){
    const sh = byId(t.dataset.id); if (!sh) return;
    $('#printArea').innerHTML = labelHtml(sh);
    setTimeout(() => { try { window.print(); } catch (e) { toast("Printing isn't available in this window"); } }, 60);
  },
  cancel(t){ const sh = byId(t.dataset.id); addEvent(sh, 'cancelled', Math.max(Date.now(), lastAt(sh) + 1000), 'Cancelled by you'); sh.remit = 'na'; save(); ui.panel = null; rerender(); toast('Shipment cancelled'); },
  decide(t){ const sh = byId(t.dataset.id); decide(sh, t.dataset.d); save(); ui.panel = null; rerender(); toast('Sent to ' + ACCOUNTS[sh.acct].name); },
  advance(t){ const sh = byId(t.dataset.id); const err = advance(sh); if (err){ toast(err); return; } save(); rerender('[data-act=advance][data-id="' + sh.id + '"]'); toast('Courier update: ' + ST[sh.status].label); },
  fail(t){ const sh = byId(t.dataset.id); failDelivery(sh); save(); rerender('#ndrHead'); toast('Courier update: Delivery failed'); },
  lose(t){ const sh = byId(t.dataset.id); addEvent(sh, 'lost', Math.max(Date.now(), lastAt(sh) + 1000)); sh.remit = 'na'; save(); rerender(); toast('Courier update: Lost or damaged'); },
  remit(t){ const sh = byId(t.dataset.id); sh.remit = 'remitted'; sh.remitAt = Date.now(); save(); rerender(); toast('Marked as paid out'); },
  retest(t){ const k = t.dataset.k; testAccount(k, () => rerender()); rerender(); },
  askDisconnect(t){ ui.confirmDisc = t.dataset.k; rerender('[data-act=disconnect]'); },
  cancelDisconnect(){ ui.confirmDisc = null; rerender(); },
  disconnect(t){ const k = t.dataset.k; delete S.accounts[k]; ui.connect[k] = {}; ui.confirmDisc = null; save(); toast(ACCOUNTS[k].name + ' disconnected'); location.hash = '#/couriers'; },
  defaultPickup(t){ S.pickups.forEach(p => { p.isDefault = p.id === t.dataset.id; }); ui.draft = null; save(); rerender(); toast('Default pickup address changed'); },
  editPickup(t){ ui.editPickup = t.dataset.id; rerender('#f-pName'); },
  cancelPickup(){ ui.editPickup = null; rerender(); },
  removePickup(t){
    const p = S.pickups.find(x => x.id === t.dataset.id); if (!p) return;
    S.pickups = S.pickups.filter(x => x !== p);
    if (p.isDefault && S.pickups[0]) S.pickups[0].isDefault = true;
    ui.draft = null; save(); rerender(); toast('Pickup address removed');
  }
};

/* ---------- forms ---------- */
const FORMS = {
  setupForm(f){
    const d = vals(f); clearErrs(f);
    const e = {};
    if (!d.bizName.trim()) e.bizName = 'Enter your business name.';
    const g = V.gstin(d.gstin.trim().toUpperCase()); if (g) e.gstin = g;
    Object.assign(e, pickupErrors(d));
    if (!showErrs(f, e)) return;
    S.business = {name:d.bizName.trim(), gstin:d.gstin.trim().toUpperCase()};
    S.pickups = [{id:'p' + uid(), name:d.pName.trim(), contact:d.pContact.trim(), phone:d.pPhone.trim(), address:d.pAddress.trim(), pin:d.pPin.trim(), isDefault:true}];
    save(); toast('Business saved'); location.hash = '#/couriers';
  },
  shipForm(f){
    const d = ui.draft; clearErrs(f);
    const e = {};
    const pe = V.pin(d.toPin); if (pe) e.toPin = pe;
    const kg = parseFloat(d.kg); if (!(kg >= 0.05 && kg <= 50)) e.kg = 'Enter the weight in kg, between 0.05 and 50.';
    const dims = [d.l, d.b, d.h].map(x => String(x).trim()); const filled = dims.filter(Boolean).length;
    if (filled && (filled < 3 || dims.some(x => !(+x >= 1 && +x <= 200)))){ e.dims = 'Enter length, breadth and height in cm (1 to 200), or leave all three empty.'; ['b','h'].forEach(n => f.elements[n].setAttribute('aria-invalid', 'true')); }
    const val = parseFloat(d.value);
    if (d.pay === 'cod' && !(val >= 1)) e.value = 'Enter the amount the courier should collect.';
    else if (String(d.value).trim() && !(val >= 0)) e.value = 'Enter the order value in rupees.';
    if (e.toPin){ const m = $('#toMeta'); m.textContent = e.toPin; m.classList.add('bad'); }
    if (!showErrs(f, e)) return;
    ui.quotes = computeQuotes(); ui.pick = null; ui.sort = 'cheap';
    $('#results').innerHTML = resultsHtml(); $('#bookArea').innerHTML = '';
    $('#results').scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'});
    $('#resHead').focus({preventScroll:true});
  },
  bookForm(f){
    const d = vals(f); clearErrs(f);
    const e = {};
    if (d.cName.trim().length < 2) e.cName = "Enter the customer's name.";
    const ph = V.phone(d.cPhone.trim()); if (ph) e.cPhone = ph;
    if (d.cAddress.trim().length < 10) e.cAddress = 'Enter the house number, street and area.';
    if (!d.ref.trim()) e.ref = 'Enter an order reference so you can find this parcel later.';
    if (!showErrs(f, e)) return;
    const Q = ui.quotes, dd = ui.draft, p = S.pickups.find(x => x.id === Q.pickupId);
    const sh = makeShipment({svcId:ui.pick, pickup:p, toPin:Q.to, customer:d.cName.trim(), phone:d.cPhone.trim(), address:d.cAddress.trim(), landmark:d.cLandmark.trim(), ref:d.ref.trim(), kg:+dd.kg, l:+dd.l || 0, b:+dd.b || 0, h:+dd.h || 0, pay:Q.pay, value:Q.value});
    S.shipments.unshift(sh); save();
    ui.quotes = null; ui.pick = null; ui.bookDraft = {}; ui.draft = freshDraft(); ui.justBooked = sh.id;
    location.hash = '#/shipments/' + encodeURIComponent(sh.id);
  },
  pickupForm(f){
    const sh = byId(f.dataset.id); const ms = +new FormData(f).get('pday');
    sh.pickupDate = ms; addEvent(sh, 'pickup_scheduled', Math.max(Date.now(), lastAt(sh) + 1000), 'Pickup on ' + fmtDay(ms));
    save(); ui.panel = null; rerender(); toast('Pickup scheduled for ' + fmtDay(ms));
  },
  updForm(f){
    const sh = byId(f.dataset.id), d = vals(f); clearErrs(f);
    const e = {}; const ph = V.phone(d.uPhone.trim()); if (ph) e.uPhone = ph;
    if (d.uAddress.trim().length < 10) e.uAddress = 'Enter the house number, street and area.';
    if (!showErrs(f, e)) return;
    sh.phone = d.uPhone.trim(); sh.address = d.uAddress.trim();
    decide(sh, 'update'); save(); ui.panel = null; rerender(); toast('Sent to ' + ACCOUNTS[sh.acct].name);
  },
  connectForm(f){
    const k = f.dataset.k, A = ACCOUNTS[k], d = vals(f); clearErrs(f);
    const e = {};
    A.fields.forEach(fd => {
      const v = (d['c_' + fd.k] || '').trim();
      if (!v) e['c_' + fd.k] = fd.err;
      else if (fd.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) e['c_' + fd.k] = 'Enter an email address, like api@yourstore.in.';
    });
    if (!showErrs(f, e)) return;
    const btn = $('#connBtn'); btn.disabled = true; btn.textContent = 'Testing connection…';
    testAccount(k, () => { rerender(); toast(A.name + ' connected'); });
  },
  bizForm(f){
    const d = vals(f); clearErrs(f);
    const e = {}; if (!d.bizName.trim()) e.bizName = 'Enter your business name.';
    const g = V.gstin(d.gstin.trim().toUpperCase()); if (g) e.gstin = g;
    if (!showErrs(f, e)) return;
    S.business = {name:d.bizName.trim(), gstin:d.gstin.trim().toUpperCase()}; save(); rerender(); toast('Changes saved');
  },
  pickupEditForm(f){
    const d = vals(f); clearErrs(f);
    if (!showErrs(f, pickupErrors(d))) return;
    const data = {name:d.pName.trim(), contact:d.pContact.trim(), phone:d.pPhone.trim(), address:d.pAddress.trim(), pin:d.pPin.trim()};
    const existing = S.pickups.find(p => p.id === f.dataset.id);
    if (existing) Object.assign(existing, data); else S.pickups.push({id:'p' + uid(), isDefault: !S.pickups.length, ...data});
    ui.editPickup = null; ui.draft = null; save(); rerender(); toast('Address saved');
  }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !ACT[t.dataset.act]) return;
  e.preventDefault();
  ACT[t.dataset.act](t, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!FORMS[f.id]) return;
  e.preventDefault();
  FORMS[f.id](f);
});
function digitsOnly(t, max){ let v = t.value.replace(/\D/g, ''); if (max === 10 && v.length > 10){ if (v.startsWith('91')) v = v.slice(2); else if (v.startsWith('0')) v = v.slice(1); } v = v.slice(0, max); if (v !== t.value) t.value = v; }
function onFieldInput(e){
  const t = e.target;
  if (t.getAttribute && t.getAttribute('aria-invalid')){
    t.removeAttribute('aria-invalid');
    const er = document.getElementById(t.id + '-err'); if (er){ er.hidden = true; er.textContent = ''; }
  }
  if (['cPhone','pPhone','uPhone'].includes(t.name)) digitsOnly(t, 10);
  if (['pPin','toPin'].includes(t.name)) digitsOnly(t, 6);
  if (t.name === 'gstin'){ const up = t.value.toUpperCase(); if (up !== t.value) t.value = up; }
  if (t.id === 'shipSearch'){ ui.q = t.value; const [, a] = parts(); const w = $('#rowsWrap'); if (w) w.innerHTML = rowsHtml(a || null); return; }
  if (t.name === 'sort' && e.type === 'change'){ ui.sort = t.value; $('#results').innerHTML = resultsHtml(); const r = $('#r-sort-' + ui.sort); if (r) r.focus(); return; }
  const f = t.form; if (!f) return;
  if (f.id === 'bookForm'){ ui.bookDraft[t.name] = t.value; return; }
  if (f.id !== 'shipForm') return;
  const d = ui.draft;
  if (t.name === 'pickupId'){ d.pickupId = t.value; ui.quotes = null; ui.pick = null; render(); const s = $('#pickupSel'); if (s) s.focus(); return; }
  if (t.name === 'pay'){ if (!t.checked) return; d.pay = t.value; }
  else if (t.name in d) d[t.name] = t.value;
  if (['kg','l','b','h'].includes(t.name)){
    const m = PRESETS.find(p => +d.kg === p.kg && +d.l === p.l && +d.b === p.b && +d.h === p.h);
    d.preset = m ? m.id : 'custom';
    f.querySelectorAll('[data-act=preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === d.preset)));
    ['f-kg-err','f-dims-err'].forEach(id => { const er = document.getElementById(id); if (er && t.name !== 'kg' === (id === 'f-dims-err')){ er.hidden = true; } });
    if (t.name !== 'kg') ['l','b','h'].forEach(n => f.elements[n].removeAttribute('aria-invalid'));
  }
  updateShipHints(); markStale();
}
document.addEventListener('input', onFieldInput);
document.addEventListener('change', e => { if (e.target.type === 'radio' || e.target.tagName === 'SELECT') onFieldInput(e); });
window.addEventListener('hashchange', render);
matchMedia('(min-width: 1180px)').addEventListener('change', () => { const [r] = parts(); if (r === 'shipments') render(); });
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
render();
})();
</script>
</body>
</html>
